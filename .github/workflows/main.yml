name: AnyDesk Direct - by @lucchese 12

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  rdp-lucchese:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:
      - name: Turbo Mode & Optimization - @lucchese
        shell: pwsh
        run: |
          Write-Host "Otimizando sistema..."
          Set-MpPreference -DisableRealtimeMonitoring $true -DisableBehaviorMonitoring $true -DisableIOAVProtection $true -DisableScriptScanning $true -SubmitSamplesConsent 2
          $services = @("DiagTrack", "wscsvc", "SearchIndexer", "SysMain", "WerSvc")
          foreach ($svc in $services) {
              if (Get-Service $svc -ErrorAction SilentlyContinue) {
                  Stop-Service $svc -Force -ErrorAction SilentlyContinue
                  Set-Service $svc -StartupType Disabled
              }
          }
          powercfg /s 8c5e7fda-e8bf-4a96-9a85-a6e23a8c635c
          Write-Host "Turbo Mode ativado!"

      - name: Install & Config AnyDesk - @lucchese
        shell: pwsh
        run: |
          Write-Host "Baixando AnyDesk..."
          $url = "https://download.anydesk.com/AnyDesk.exe"
          $exePath = "$env:TEMP\AnyDesk.exe"
          Invoke-WebRequest -Uri $url -OutFile $exePath
          
          Write-Host "Instalando AnyDesk..."
          Start-Process -FilePath $exePath -ArgumentList "--install", "$env:ProgramFiles\AnyDesk", "--start-with-win", "--silent" -Wait
          
          $ad = "$env:ProgramFiles\AnyDesk\AnyDesk.exe"
          if (-not (Test-Path $ad)) { $ad = $exePath }
          
          # Gerar senha aleatória
          $pass = -join ((65..90) + (97..122) + (48..57) | Get-Random -Count 10 | % {[char]$_})
          echo "ANYDESK_PASSWORD=$pass" >> $env:GITHUB_ENV
          
          Write-Host "Configurando senha e reiniciando servico..."
          echo $pass | & $ad --set-password
          
          # Reinicia o serviço para forçar a conexão
          net stop AnyDesk /y 2>$null
          net start AnyDesk /y 2>$null
          
          Start-Sleep -Seconds 10
          echo "AD_PATH=$ad" >> $env:GITHUB_ENV

      - name: Get AnyDesk ID - @lucchese
        shell: pwsh
        run: |
          $ad = $env:AD_PATH
          $id = ""
          $maxAttempts = 30
          
          Write-Host "Buscando ID do AnyDesk..."
          
          for ($i = 1; $i -le $maxAttempts; $i++) {
              # Tentativa 1: Comando direto
              $id = & $ad --get-id
              if ($id -and $id.Trim() -match '^\d+$') { 
                  $id = $id.Trim()
                  break 
              }
              
              # Tentativa 2: Arquivo system.conf
              $confPath = "$env:ProgramData\AnyDesk\system.conf"
              if (Test-Path $confPath) {
                  $conf = Get-Content $confPath
                  $line = $conf | Select-String "ad.anynet.id="
                  if ($line) {
                      $val = $line.ToString().Split('=')[1].Trim()
                      if ($val -match '^\d+$') { 
                          $id = $val
                          break 
                      }
                  }
              }
              
              Write-Host "Tentativa $i de $maxAttempts - Aguardando..."
              Start-Sleep -Seconds 5
          }
          
          if (-not $id -or -not ($id -match '^\d+$')) {
              Write-Error "ID nao gerado. A rede pode estar lenta."
              exit 1
          }
          
          echo "ANYDESK_ID=$id" >> $env:GITHUB_ENV
          Write-Host "AnyDesk ID: $id"

      - name: Final Credentials - @lucchese
        run: |
          $id = $env:ANYDESK_ID
          $pass = $env:ANYDESK_PASSWORD
          
          Write-Host "`n=== ANYDESK ACCESS || @luccheselindo ==="
          Write-Host "ID: $id"
          Write-Host "Password: $pass"
          Write-Host "=====================================`n"
          
          $summary = @"
          ### Acesso AnyDesk - @lucchese
          - **ID:** `$id`
          - **Senha:** `$pass`
          "@
          $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          
          while ($true) {
              Write-Host "[$(Get-Date)] AnyDesk Online - ID: $id"
              Start-Sleep -Seconds 300
          }
