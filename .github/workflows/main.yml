name: AnyDesk Direct - by @lucchese

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  rdp-lucchese:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:
      - name: Turbo Mode & Optimization - @lucchese
        shell: pwsh
        run: |
          Write-Host "Otimizando sistema..."
          Set-MpPreference -DisableRealtimeMonitoring $true -DisableBehaviorMonitoring $true -DisableIOAVProtection $true -DisableScriptScanning $true -SubmitSamplesConsent 2
          $services = @("DiagTrack", "wscsvc", "SearchIndexer", "SysMain", "WerSvc")
          foreach ($svc in $services) {
              if (Get-Service $svc -ErrorAction SilentlyContinue) {
                  Stop-Service $svc -Force -ErrorAction SilentlyContinue
                  Set-Service $svc -StartupType Disabled
              }
          }
          powercfg /s 8c5e7fda-e8bf-4a96-9a85-a6e23a8c635c
          Write-Host "Turbo Mode ativado!"

      - name: Install AnyDesk - @lucchese
        shell: pwsh
        run: |
          Write-Host "Baixando AnyDesk..."
          $url = "https://download.anydesk.com/AnyDesk.exe"
          $installerPath = "$env:TEMP\AnyDesk_Setup.exe"
          Invoke-WebRequest -Uri $url -OutFile $installerPath
          
          Write-Host "Instalando AnyDesk silenciosamente..."
          # Tenta instalar tanto em Program Files quanto Program Files (x86)
          Start-Process -FilePath $installerPath -ArgumentList "--install", "$env:ProgramFiles\AnyDesk", "--start-with-win", "--silent" -Wait
          
          $adPaths = @(
              "$env:ProgramFiles\AnyDesk\AnyDesk.exe",
              "${env:ProgramFiles(x86)}\AnyDesk\AnyDesk.exe",
              "$env:TEMP\AnyDesk_Setup.exe" # Fallback para rodar direto do instalador se falhar
          )
          
          $ad = ""
          foreach ($path in $adPaths) {
              if (Test-Path $path) {
                  $ad = $path
                  break
              }
          }
          
          if (-not $ad) {
              Write-Error "AnyDesk nao encontrado apos instalacao."
              exit 1
          }
          
          Write-Host "AnyDesk encontrado em: $ad"
          
          # Gerar senha aleatória
          $pass = -join ((65..90) + (97..122) + (48..57) | Get-Random -Count 10 | % {[char]$_})
          echo "ANYDESK_PASSWORD=$pass" >> $env:GITHUB_ENV
          
          Write-Host "Configurando senha..."
          echo $pass | & $ad --set-password
          Start-Sleep -Seconds 5
          
          # Salva o caminho para o proximo passo
          echo "AD_PATH=$ad" >> $env:GITHUB_ENV

      - name: Get AnyDesk ID - @lucchese
        shell: pwsh
        run: |
          $ad = $env:AD_PATH
          $id = ""
          $timeout = 60
          $elapsed = 0
          
          Write-Host "Aguardando ID..."
          while (-not $id -and $elapsed -lt $timeout) {
              $id = & $ad --get-id
              if ($id) { $id = $id.Trim() }
              if (-not $id) {
                  Start-Sleep -Seconds 2
                  $elapsed += 2
              }
          }
          
          if (-not $id) {
              Write-Error "ID nao gerado."
              exit 1
          }
          
          echo "ANYDESK_ID=$id" >> $env:GITHUB_ENV
          Write-Host "AnyDesk ID: $id"

      - name: Final Credentials - @lucchese
        run: |
          $id = $env:ANYDESK_ID
          $pass = $env:ANYDESK_PASSWORD
          
          Write-Host "`n=== ANYDESK ACCESS || @luccheselindo ==="
          Write-Host "ID: $id"
          Write-Host "Password: $pass"
          Write-Host "=====================================`n"
          
          $summary = @"
          ### Acesso AnyDesk - @lucchese
          - **ID:** `$id`
          - **Senha:** `$pass`
          "@
          $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          
          while ($true) {
              Write-Host "[$(Get-Date)] AnyDesk Online - ID: $id"
              Start-Sleep -Seconds 300
          }
